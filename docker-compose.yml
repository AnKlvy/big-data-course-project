version: '3.8'

services:

  # One-shot ETL: generates SQLite DB, runs Spark pipeline, writes Parquet to data/
  etl:
    build: .
    command: python main.py
    volumes:
      - app_data:/app/data
    restart: "no"

  # Long-running Streamlit dashboard — reads processed Parquet from the shared volume
  dashboard:
    build: .
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - app_data:/app/data
    restart: unless-stopped

volumes:
  app_data:
